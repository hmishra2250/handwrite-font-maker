services:
  - type: web
    name: handwrite-font-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerCommand: python -m handwrite_font_maker.web.server
    plan: free
    autoDeploy: false  # Enable only after the production gates in docs/DEPLOYMENT.md.
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: handwrite-font-jobs
      - key: DATABASE_URL
        sync: false
      - key: PROCESS_JOBS_INLINE
        value: "1"
