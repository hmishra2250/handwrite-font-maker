name: Verify private beta
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handwrite
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: handwrite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handwrite -d handwrite_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://handwrite:test-only@127.0.0.1:5432/handwrite_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fontforge potrace
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck && npm run lint && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t handwrite-api:verify .
      - run: docker run --rm handwrite-api:verify python -c 'import os; assert os.getuid() != 0'
      - run: docker build -f Dockerfile.web -t handwrite-web:verify .
